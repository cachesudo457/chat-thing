<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The room — admin</title>
<style>
  :root {
    --cream: #faf6ef;
    --sage: #8ba888;
    --sage-dark: #6d8a6b;
    --peach: #ffe3cc;
    --peach-text: #7a4a1f;
    --lav: #e6e2f5;
    --lav-text: #4d4470;
    --ink: #4a453d;
    --ink-dim: #9b9488;
    --line: #e9e1d3;
    --danger: #c17a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 24px; }
  .gate {
    max-width: 360px;
    margin: 80px auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  input {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 15px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    width: 100%;
  }
  input:focus { border-color: var(--sage); }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--sage); color: #fff; }
  .btn-primary:hover { background: var(--sage-dark); }
  .btn-danger { background: var(--peach); color: var(--peach-text); }
  .btn-danger:hover { filter: brightness(0.95); }
  .btn-ghost { background: var(--lav); color: var(--lav-text); }
  .btn-ghost:hover { filter: brightness(0.95); }
  .err { color: var(--danger); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { color: var(--ink-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge.online { background: var(--sage); color: #fff; }
  .badge.offline { background: var(--line); color: var(--ink-dim); }
  .badge.banned { background: var(--peach); color: var(--peach-text); margin-left: 6px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { color: var(--ink-dim); font-size: 13.5px; padding: 20px 0; text-align: center; }
  .toast {
    position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
  .section {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .section h2 { font-size: 15px; margin: 0 0 4px; }
  .section .sub { margin-bottom: 12px; }
  textarea {
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    width: 100%;
    resize: vertical;
    min-height: 60px;
  }
  textarea:focus { border-color: var(--sage); }
  .composer-row { display: flex; justify-content: flex-end; margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  const root = document.getElementById('root');
  let adminPassword = '';

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  async function adminFetch(url, options) {
    const opts = options || {};
    opts.headers = Object.assign({ 'x-admin-password': adminPassword }, opts.headers || {});
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function renderGate(errorMsg) {
    root.innerHTML = `
      <div class="gate">
        <h1>Admin</h1>
        <p class="sub">Enter the admin password to manage accounts.</p>
        <input id="pw-in" type="password" placeholder="Admin password" />
        ${errorMsg ? `<div class="err">${esc(errorMsg)}</div>` : ''}
        <button class="btn-primary" id="unlock-btn">Unlock</button>
      </div>
    `;
    const pwIn = document.getElementById('pw-in');
    const go = async () => {
      const typed = pwIn.value;
      if (!typed) return;
      try {
        await fetch('/admin/api/check', { method: 'POST', headers: { 'x-admin-password': typed } })
          .then(async r => { if (!r.ok) throw new Error((await r.json()).error || 'Wrong password'); });
        adminPassword = typed;
        renderDashboard();
      } catch (e) {
        renderGate(e.message || 'Wrong password.');
      }
    };
    document.getElementById('unlock-btn').onclick = go;
    pwIn.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    pwIn.focus();
  }

  async function renderDashboard() {
    root.innerHTML = `
      <div class="wrap">
        <h1>Admin</h1>
        <p class="sub">Manage who can use the chat.</p>

        <div class="section">
          <h2>Send a message</h2>
          <p class="sub">Posts into the chat as "Admin", with a staff badge next to it.</p>
          <textarea id="admin-msg" maxlength="2000" placeholder="Type a message..."></textarea>
          <div class="composer-row"><button class="btn-primary" id="send-msg-btn">Send message</button></div>
        </div>

        <div class="section">
          <h2>Post an announcement</h2>
          <p class="sub">Shows as a highlighted banner in the chat, separate from normal messages.</p>
          <textarea id="admin-announcement" maxlength="500" placeholder="Type an announcement..."></textarea>
          <div class="composer-row"><button class="btn-primary" id="send-announcement-btn">Post announcement</button></div>
        </div>

        <div id="table-holder"><div class="empty">Loading…</div></div>
      </div>
    `;
    document.getElementById('send-msg-btn').onclick = async () => {
      const el = document.getElementById('admin-msg');
      const text = el.value.trim();
      if (!text) return;
      try {
        await adminFetch('/admin/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        el.value = '';
        showToast('Message sent.');
      } catch (e) {
        showToast(e.message || 'Could not send message.');
      }
    };
    document.getElementById('send-announcement-btn').onclick = async () => {
      const el = document.getElementById('admin-announcement');
      const text = el.value.trim();
      if (!text) return;
      try {
        await adminFetch('/admin/api/announcement', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        el.value = '';
        showToast('Announcement posted.');
      } catch (e) {
        showToast(e.message || 'Could not post announcement.');
      }
    };
    await refreshUsers();
  }

  async function refreshUsers() {
    const holder = document.getElementById('table-holder');
    try {
      const data = await adminFetch('/admin/api/users');
      if (!data.users || data.users.length === 0) {
        holder.innerHTML = '<div class="empty">No accounts yet.</div>';
        return;
      }
      holder.innerHTML = `
        <table>
          <thead>
            <tr><th>Name</th><th>Status</th><th>Created</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.users.map(u => `
              <tr>
                <td>${esc(u.name)}</td>
                <td>
                  <span class="badge ${u.online ? 'online' : 'offline'}">${u.online ? 'Online' : 'Offline'}</span>
                  ${u.banned ? '<span class="badge banned">Banned</span>' : ''}
                </td>
                <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
                <td class="actions">
                  <button class="btn-ghost" data-action="reset" data-name="${esc(u.name)}">Reset password</button>
                  ${u.banned
                    ? `<button class="btn-ghost" data-action="unban" data-name="${esc(u.name)}">Unban</button>`
                    : `<button class="btn-danger" data-action="ban" data-name="${esc(u.name)}">Ban</button>`}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      holder.querySelectorAll('button[data-action]').forEach(btn => {
        btn.onclick = () => handleAction(btn.getAttribute('data-action'), btn.getAttribute('data-name'));
      });
    } catch (e) {
      holder.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  async function handleAction(action, name) {
    try {
      if (action === 'ban') {
        if (!confirm(`Ban ${name}? They'll be kicked immediately and can't log back in until unbanned.`)) return;
        await adminFetch('/admin/api/ban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        showToast(`${name} banned.`);
      } else if (action === 'unban') {
        await adminFetch('/admin/api/unban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        showToast(`${name} unbanned.`);
      } else if (action === 'reset') {
        if (!confirm(`Reset ${name}'s password? Their old password will stop working.`)) return;
        const data = await adminFetch('/admin/api/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        prompt(`New password for ${name} (copy this now, it won't be shown again):`, data.password);
      }
      refreshUsers();
    } catch (e) {
      showToast(e.message || 'Something went wrong.');
    }
  }

  renderGate();
})();
</script>
</body>
</html>
