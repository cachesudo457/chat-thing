<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess Thing</title>
<style>
  :root {
    --cream: #faf6ef;
    --sage: #8ba888;
    --sage-dark: #6d8a6b;
    --moss: #4f6b52;
    --peach: #ffe3cc;
    --peach-text: #7a4a1f;
    --lav: #e6e2f5;
    --lav-text: #4d4470;
    --ink: #4a453d;
    --ink-dim: #9b9488;
    --line: #e9e1d3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    background: var(--cream);
  }
  button, input { transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease; }
  button:active { transform: scale(0.96); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .app {
    color: var(--ink);
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--sage);
    color: #fff;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff3d;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; flex-shrink: 0; white-space: nowrap;
    overflow: hidden;
  }
  .topbar .titles { display: flex; flex-direction: column; line-height: 1.35; }
  .topbar .room-name { font-size: 16px; font-weight: 700; }
  .topbar .room-sub { font-size: 12px; color: #eef6ec; }
  .topbar .switch {
    margin-left: auto;
    font-size: 12.5px;
    color: #eef6ec;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 20px;
    background: #ffffff26;
    white-space: nowrap;
    border: none;
  }
  .topbar .switch:hover { background: #ffffff40; }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    background: var(--cream);
    scroll-behavior: smooth;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13.5px;
    line-height: 1.9;
  }
  .msg { max-width: 74%; display: flex; flex-direction: column; gap: 3px; animation: msgIn 0.25s ease; }
  .announcement {
    align-self: center;
    max-width: 90%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    animation: msgIn 0.25s ease;
    margin: 4px 0;
  }
  .announcement .banner {
    background: var(--lav);
    color: var(--lav-text);
    border-radius: 14px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    max-width: 480px;
  }
  .announcement .banner-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sage-dark);
    margin-bottom: 2px;
  }
  .announcement .time { font-size: 10px; color: var(--ink-dim); }
  .admin-badge {
    display: inline-block;
    background: var(--sage);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 8px;
    vertical-align: middle;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.theirs { align-self: flex-start; align-items: flex-start; }
  .sender { font-size: 12px; font-weight: 700; margin: 0 4px; color: var(--sage-dark); }
  .bubble {
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
  }
  .msg.mine .bubble { background: var(--peach); color: var(--peach-text); border-bottom-right-radius: 4px; }
  .msg.theirs .bubble { background: var(--lav); color: var(--lav-text); border-bottom-left-radius: 4px; }
  .meta-row { display: flex; align-items: center; gap: 6px; }
  .time { font-size: 10.5px; color: var(--ink-dim); margin: 0 4px; }
  .delete-btn {
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font-size: 10.5px; padding: 0; width: auto; height: auto; text-decoration: underline;
  }
  .delete-btn:hover { color: var(--peach-text); }
  .bubble img.attach-img { max-width: 220px; border-radius: 12px; display: block; }
  .bubble video.attach-video, .bubble audio.attach-audio { max-width: 220px; border-radius: 12px; display: block; }
  .bubble audio.attach-audio { width: 220px; }
  .bubble .file-link {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 2px; text-decoration: none; color: inherit; font-size: 13.5px; font-weight: 600;
  }
  .bubble .file-link .file-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; flex-shrink: 0;
  }
  .file-icon.k-pdf { background: #f6cfc4; color: #8a3a1f; }
  .file-icon.k-doc { background: #cfe0f6; color: #244a7a; }
  .file-icon.k-sheet { background: #d3e8c9; color: #395c26; }
  .file-icon.k-slide { background: #f6ddc0; color: #7a4d10; }
  .file-icon.k-archive { background: #e2ddd1; color: #55503f; }
  .file-icon.k-audio { background: var(--lav); color: var(--lav-text); }
  .file-icon.k-file { background: var(--lav); color: var(--lav-text); }
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    height: 0;
    overflow: hidden;
    opacity: 0;
    transition: height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
    color: var(--ink-dim);
    font-size: 12.5px;
  }
  .typing-indicator.show { height: 28px; opacity: 1; padding: 6px 16px; }
  .typing-dots { display: flex; gap: 3px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-dim);
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  .picker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 0 16px;
    background: #fff;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    border-top: 0px solid var(--line);
    transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  }
  .picker.open { max-height: 160px; opacity: 1; padding: 12px 16px; border-top-width: 1px; overflow-y: auto; }
  .picker button {
    background: var(--cream);
    border: none;
    border-radius: 10px;
    padding: 8px 4px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    line-height: 1.3;
  }
  .picker button:hover { background: var(--lav); }
  .attach-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    background: #fff;
    font-size: 13px;
    color: var(--ink);
    height: 0;
    overflow: hidden;
    opacity: 0;
    border-top: 0px solid var(--line);
    transition: height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  }
  .attach-preview.open { height: 60px; opacity: 1; padding: 10px 16px; border-top-width: 1px; }
  .attach-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
  .attach-preview .file-chip {
    width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .attach-preview .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-preview .remove {
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font-size: 13px; padding: 4px 8px; width: auto; height: auto; border-radius: 8px;
  }
  .attach-preview .remove:hover { background: var(--cream); }
  .inputrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--cream);
    border-top: 1px solid var(--line);
  }
  .inputrow input[type=text] {
    flex: 1;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 16px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
  }
  .inputrow input[type=text]:focus { border-color: var(--sage); }
  .inputrow button {
    background: var(--sage);
    color: #fff;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .inputrow button:hover { background: var(--sage-dark); }
  .attach-toggle, .picker-toggle {
    background: #fff !important;
    color: var(--sage-dark) !important;
    border: 1px solid var(--line) !important;
  }
  .attach-toggle:hover, .picker-toggle:hover { background: var(--lav) !important; }

  .gate {
    padding: 44px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    text-align: center;
    background: var(--cream);
  }
  .gate .avatar-lg {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--lav);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-bottom: 6px;
  }
  .gate h1 { font-size: 19px; color: var(--ink); margin: 0; font-weight: 700; }
  .gate p { color: var(--ink-dim); font-size: 13.5px; margin: 0; max-width: 290px; line-height: 1.7; }
  .gate-field { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px; text-align: left; }
  .gate-field label { font-size: 11.5px; color: var(--ink-dim); font-weight: 600; }
  .gate-field input {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 15px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
  }
  .gate-field input:focus { border-color: var(--sage); }
  .gate button.join {
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 13px 28px;
    border-radius: 24px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    width: 100%;
    max-width: 280px;
  }
  .gate button.join:hover { background: var(--sage-dark); }
  .gate .err { color: #c17a5a; font-size: 12.5px; }
  .link-btn {
    color: var(--ink-dim); font-size: 12.5px; text-decoration: underline;
    cursor: pointer; margin-top: 4px;
  }
  .link-btn:hover { color: var(--sage-dark); }

  /* ---- Dashboard ---- */
  .dash-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 40px;
  }
  .dash-content::-webkit-scrollbar { width: 8px; }
  .dash-content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .dash-wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    animation: msgIn 0.2s ease;
  }
  .card h2 { font-size: 14.5px; margin: 0 0 3px; color: var(--ink); }
  .card .sub { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 12px; line-height: 1.6; }
  .card .status { font-size: 12px; margin-top: 8px; }
  .card .status.ok { color: var(--sage-dark); }
  .card .status.err { color: #c17a5a; }
  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .profile-row .avatar-md {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--lav);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
    overflow: hidden;
  }
  .profile-row .profile-name { font-weight: 700; font-size: 15px; color: var(--ink); }
  .card textarea {
    width: 100%; min-height: 70px; resize: vertical;
    background: var(--cream); border: 1px solid var(--line); color: var(--ink);
    padding: 12px 14px; border-radius: 14px; font-family: inherit; font-size: 14px; outline: none;
  }
  .card textarea:focus { border-color: var(--sage); }
  .card-btn-row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .btn-sage {
    background: var(--sage); color: #fff; border: none;
    border-radius: 20px; padding: 9px 20px; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-sage:hover { background: var(--sage-dark); }
  .btn-sage:disabled { opacity: 0.5; cursor: default; background: var(--sage); }
  .btn-sage-outline {
    background: #fff; color: var(--sage-dark); border: 1px solid var(--line);
    border-radius: 20px; padding: 12px 20px; font-family: inherit;
    font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
  }
  .btn-sage-outline:hover { background: var(--lav); }
  .friend-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px;
  }
  .friend-row:last-child { border-bottom: none; }
  .friend-row .fname { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .friend-row .factions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-mini {
    border: none; border-radius: 14px; padding: 6px 12px; font-family: inherit;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn-mini.accept { background: var(--sage); color: #fff; }
  .btn-mini.accept:hover { background: var(--sage-dark); }
  .btn-mini.decline { background: var(--peach); color: var(--peach-text); }
  .btn-mini.decline:hover { filter: brightness(0.95); }
  .btn-mini.neutral { background: var(--lav); color: var(--lav-text); }
  .btn-mini.neutral:hover { filter: brightness(0.95); }
  .add-friend-row { display: flex; gap: 8px; margin-top: 4px; }
  .add-friend-row input {
    flex: 1; background: var(--cream); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 13px; border-radius: 14px; font-family: inherit; font-size: 13.5px; outline: none;
  }
  .add-friend-row input:focus { border-color: var(--sage); }
  .friend-section-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-dim); margin: 14px 0 2px;
  }
  .friend-section-label:first-child { margin-top: 4px; }
  .btn-mini.call { background: var(--moss); color: #fff; }
  .btn-mini.call:hover { filter: brightness(1.1); }
  .btn-mini.call:disabled { opacity: 0.5; cursor: default; filter: none; }

  /* ---- Voice call ---- */
  .call-minibar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px;
    background: var(--moss); color: #fff; padding: 9px 14px;
    font-size: 13px; cursor: pointer; box-shadow: 0 2px 10px #0002;
  }
  .call-minibar .mini-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--sage);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; overflow: hidden; flex-shrink: 0;
  }
  .call-minibar .mini-name { font-weight: 700; flex: 1; }
  .call-minibar .mini-time { opacity: 0.85; font-variant-numeric: tabular-nums; }
  .call-minibar .mini-hangup {
    background: #ffffff30; border: none; color: #fff; padding: 6px 13px;
    border-radius: 14px; cursor: pointer; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
    font-family: inherit;
  }
  .call-overlay {
    position: fixed; inset: 0; z-index: 50; background: var(--cream);
    display: flex; flex-direction: column; animation: msgIn 0.2s ease;
  }
  .call-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 0;
  }
  .call-top .call-timer {
    font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums;
  }
  .call-body {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: 20px;
  }
  .call-status-text { color: var(--ink-dim); font-size: 13.5px; }
  .call-peer-name { font-size: 20px; font-weight: 800; color: var(--ink); margin-top: 4px; }
  .call-avatar-ring {
    width: 128px; height: 128px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 4px solid transparent; transition: border-color 0.15s ease;
  }
  .call-avatar-ring.speaking { border-color: var(--sage); }
  .call-avatar {
    width: 116px; height: 116px; border-radius: 50%; background: var(--lav);
    color: var(--lav-text); display: flex; align-items: center; justify-content: center;
    font-size: 44px; overflow: hidden;
  }
  .call-self-strip { display: flex; align-items: center; gap: 10px; }
  .call-self-strip .call-avatar-ring { width: 52px; height: 52px; border-width: 3px; }
  .call-self-strip .call-avatar { width: 44px; height: 44px; font-size: 18px; }
  .call-self-strip span { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
  .call-controls { display: flex; justify-content: center; gap: 22px; padding: 10px 20px 40px; }
  .call-grid { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; max-width: 420px; }
  .call-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .call-tile .call-avatar-ring { width: 92px; height: 92px; }
  .call-tile .call-avatar { width: 82px; height: 82px; font-size: 32px; }
  .call-tile-name { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .call-tile-sub { font-size: 11px; color: var(--ink-dim); }
  .call-min-btn {
    background: var(--lav); color: var(--lav-text); border: none;
    padding: 7px 15px; border-radius: 14px; font-family: inherit;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .call-pick-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--ink); cursor: pointer;
  }
  .call-pick-row:last-child { border-bottom: none; }
  .call-pick-row input { width: 16px; height: 16px; accent-color: var(--sage); cursor: pointer; }
  .call-ctrl-btn {
    border-radius: 22px; border: 1px solid var(--line); cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    padding: 13px 26px; background: #fff; color: var(--ink);
  }
  .call-ctrl-btn.muted { background: var(--peach); color: var(--peach-text); border-color: transparent; }
  .call-ctrl-btn.hangup { background: #d0684a; color: #fff; border-color: transparent; }
  .call-ctrl-btn.hangup:hover { background: #b8563b; }
  .call-ctrl-btn.accept { background: var(--sage); color: #fff; border-color: transparent; }
  .call-ctrl-btn.accept:hover { background: var(--sage-dark); }

  /* ---- Chess Thing ---- */
  .chess-sub { color: var(--ink-dim); font-size: 12px; }
  .chess-layout { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 560px) minmax(260px, 1fr); gap: 16px; align-items: start; justify-content: center; }
  .chess-main { display: grid; gap: 10px; min-width: 0; }
  .chess-status { font-size: 14px; font-weight: 700; color: var(--ink); min-height: 20px; }
  .chess-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  .chess-bar.on { border-color: var(--sage); }
  .chess-bar .av { width: 32px; height: 32px; border-radius: 50%; background: var(--lav); color: var(--lav-text); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .chess-bar .nm { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chess-bar .sd { font-size: 12px; color: var(--ink-dim); }
  .chess-bar .tx { min-width: 0; }
  .chess-bar .dot { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chess-bar.on .dot { background: var(--sage); box-shadow: 0 0 0 4px #e3ece0; }

  .chess-co.r { top: 2px; left: 4px; } .chess-co.f { right: 4px; bottom: 1px; }

  .chess-tabs { display: flex; gap: 6px; background: #f1ebdf; border-radius: 22px; padding: 4px; margin-bottom: 14px; }
  .chess-tabs button { flex: 1; border: 0; background: none; padding: 9px 12px; border-radius: 18px; font-family: inherit; font-weight: 700; font-size: 13.5px; color: var(--ink-dim); cursor: pointer; }
  .chess-tabs button[aria-selected="true"] { background: #fff; color: var(--sage-dark); box-shadow: 0 1px 3px rgba(80, 60, 40, .15); }
  .chess-levels { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chess-levels button { flex: 1; min-width: 90px; }
  [hidden] { display: none !important; }
  .chess-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 60; max-width: 90vw; animation: msgIn 0.25s ease; }
  @media (max-width: 760px) {

    .chess-chat { height: 380px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/chess-engine.js"></script>
<script>
(function() {
  const root = document.getElementById('root');
  const socket = io();
  const DEFAULT_AVATAR = { type: 'text', value: '(ー_ー)' };
  let avatar = DEFAULT_AVATAR;
  let name = '';
  let authed = false;

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function avatarInnerHTML() {
    if (avatar && avatar.type === 'image' && avatar.dataUrl) {
      return `<img src="${avatar.dataUrl}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><span style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">${esc(DEFAULT_AVATAR.value)}</span>`;
    }
    return esc((avatar && avatar.value) || DEFAULT_AVATAR.value);
  }
  let audioCtx = null;
  function playBing() {
    try {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audioCtx = new AC(); }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.35);
    } catch (e) {}
  }

  // ==== Chess Thing ====
  // Lives inside this same page, so it uses the account you're already logged in with.
  // The rules file (/chess-engine.js) is shared with the server, which checks every move.
  const CHESS_PIECE = { 1: 'p', 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };
  const CHESS_PIECE_NAME = { 1: 'pawn', 2: 'knight', 3: 'bishop', 4: 'rook', 5: 'queen', 6: 'king' };
  const CHESS_PROMO_NAME = { 2: 'Knight', 3: 'Bishop', 4: 'Rook', 5: 'Queen' };
  const CHESS_REASON = { checkmate: 'checkmate', stalemate: 'stalemate', resign: 'resignation', agreement: 'agreement', fifty: 'the fifty-move rule', repetition: 'repetition', material: 'too few pieces left' };
  let chessScreen = null; // 'lobby' | 'game' | null
  let chessId = null, chessGame = null, chessGone = false, chessChat = [];
  let chessSel = -1, chessTargets = [], chessPromo = null, chessConfirmResign = false, chessLastLen = -1, chessAwaiting = false, chessAwaitTimer = null;
  let botMode = null, botTimer = null, chessTab = 'people';
  let chessLobbyData = null, chessCacheKey = '', chessCacheRp = null, chessToastTimer = null;

  function sameName(a, b) { return !!a && !!b && String(a).toLowerCase() === String(b).toLowerCase(); }

  function ensureChessDefs() {
    if (document.getElementById('chess-defs')) return;
    document.body.insertAdjacentHTML('beforeend', `<svg id="chess-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
      <g id="pc-p"><path d="M37 80C39 68 43 60 44 50L56 50C57 60 61 68 63 80Z"/><ellipse cx="50" cy="49" rx="17" ry="5.5"/><circle cx="50" cy="31" r="13"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
      <g id="pc-r"><path d="M37 34H63L60 72H40Z"/><path d="M31 36L31 18L41 18L41 25L45.5 25L45.5 18L54.5 18L54.5 25L59 25L59 18L69 18L69 36Z"/><rect x="32" y="68" width="36" height="11" rx="4.5"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
      <g id="pc-b"><path d="M38 80C41 68 44 60 44 52L56 52C56 60 59 68 62 80Z"/><ellipse cx="50" cy="51" rx="15" ry="5"/><path d="M50 15C64 26 67 39 59 49L41 49C33 39 36 26 50 15Z"/><circle cx="50" cy="12" r="4.5"/><path d="M49 27L56 35" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
      <g id="pc-n"><path d="M62 80C62 66 67 54 65 43C63 31 55 23 46 22L44 13L37 22C31 28 24 40 22 50C21 56 26 60 32 58C37 57 41 53 45 50C41 58 37 67 37 80Z"/><path d="M58 33C54 40 54 50 57 58" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="43" cy="33" r="3.2" fill="currentColor" stroke="none"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
      <g id="pc-q"><path d="M37 80C40 68 43 62 43 56L57 56C57 62 60 68 63 80Z"/><ellipse cx="50" cy="55" rx="15" ry="5"/><path d="M30 56L24 30L39 44L50 21L61 44L76 30L70 56Z"/><circle cx="24" cy="27" r="4.5"/><circle cx="50" cy="17" r="5"/><circle cx="76" cy="27" r="4.5"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
      <g id="pc-k"><path d="M37 80C40 68 43 62 43 56L57 56C57 62 60 68 63 80Z"/><ellipse cx="50" cy="55" rx="15" ry="5"/><rect x="46.5" y="7" width="7" height="24" rx="3.5"/><rect x="40" y="13" width="20" height="7" rx="3.5"/><path d="M34 56C29 40 38 28 50 28C62 28 71 40 66 56Z"/><rect x="26" y="79" width="48" height="11" rx="5.5"/></g>
    </defs></svg>`);
  }
  function chessPieceSVG(p) {
    const w = p > 0;
    return `<svg viewBox="0 0 100 100" aria-hidden="true" color="${w ? '#7a6252' : '#e9dccb'}"><use href="#pc-${CHESS_PIECE[Math.abs(p)]}" fill="${w ? '#fffaf0' : '#5a4a3f'}" stroke="${w ? '#7a6252' : '#2c221b'}" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
  }
  function chessAgo(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' hr ago';
    return Math.round(h / 24) + ' days ago';
  }
  function chessToast(msg) {
    let t = document.getElementById('chess-toast');
    if (!t) { t = document.createElement('div'); t.id = 'chess-toast'; t.className = 'chess-toast'; document.body.appendChild(t); }
    t.textContent = msg;
    clearTimeout(chessToastTimer);
    chessToastTimer = setTimeout(() => { const el = document.getElementById('chess-toast'); if (el) el.remove(); }, 3200);
  }
  function chessOpenTable() {
    if (!window.Engine) { chessToast("Chess couldn't load. Refresh the page and try again."); return false; }
    ensureChessDefs();
    return true;
  }

  // ---- Lobby ----
  function renderChessLobby() {
    if (!chessOpenTable()) return;
    if (chessScreen === 'game' && !botMode) socket.emit('chess-close');
    botStop();
    chessScreen = 'lobby'; chessId = null; chessGame = null;
    root.innerHTML = `
      <div class="app">
        <div class="topbar">
          <div class="avatar">${avatarInnerHTML()}</div>
          <div class="titles">
            <span class="room-name">Chess Thing</span>
            <span class="room-sub">chess and a chat</span>
          </div>
          <button class="switch" id="home-btn" type="button">&lsaquo; Chat Thing</button>
        </div>
        <div class="dash-content">
          <div class="dash-wrap">
            <div class="chess-tabs" role="tablist">
              <button type="button" role="tab" data-tab="people" id="chess-tab-people">Play people</button>
              <button type="button" role="tab" data-tab="bot" id="chess-tab-bot">Play a bot</button>
            </div>
            <div id="chess-pane-people">
              <div class="card" style="margin-bottom:14px;">
                <h2>Start a game</h2>
                <p class="sub">Your side is picked at random. Your table shows up for anyone who has Chess Thing open.</p>
                <div class="card-btn-row"><button class="btn-sage" id="chess-new-btn">Start a game</button></div>
              </div>
              <div id="chess-tables"><div class="card"><p class="sub" style="margin:0;">Looking around…</p></div></div>
            </div>
            <div id="chess-pane-bot" hidden>
              <div class="card">
                <h2>Play a bot</h2>
                <p class="sub">Pick how tough it is. Your side is picked at random. There's no chat with bots. The bots are powered by the Stockfish chess engine.</p>
                <div class="chess-levels">
                  <button type="button" class="btn-sage-outline" data-level="easy">Easy</button>
                  <button type="button" class="btn-sage-outline" data-level="medium">Medium</button>
                  <button type="button" class="btn-sage-outline" data-level="hard">Hard</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    document.getElementById('home-btn').onclick = () => { location.href = '/'; };
    document.getElementById('chess-new-btn').onclick = () => socket.emit('chess-create');
    const showTab = t => {
      chessTab = t === 'bot' ? 'bot' : 'people';
      document.getElementById('chess-pane-people').hidden = chessTab !== 'people';
      document.getElementById('chess-pane-bot').hidden = chessTab !== 'bot';
      ['people', 'bot'].forEach(k => document.getElementById('chess-tab-' + k).setAttribute('aria-selected', String(chessTab === k)));
    };
    document.querySelector('.chess-tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.getAttribute('data-tab')); };
    document.getElementById('chess-pane-bot').onclick = e => { const b = e.target.closest('[data-level]'); if (b) go('bot-' + b.getAttribute('data-level')); };
    showTab(chessTab);
    document.getElementById('chess-tables').onclick = e => {
      const join = e.target.closest('[data-join]');
      if (join) { socket.emit('chess-join', { id: join.getAttribute('data-join') }); return; }
      const open = e.target.closest('[data-open]');
      if (open) go('game-' + open.getAttribute('data-open'));
    };
    socket.emit('chess-lobby-enter');
    if (chessLobbyData) chessRenderTables();
  }

  function chessRenderTables() {
    const holder = document.getElementById('chess-tables');
    if (!holder || !chessLobbyData) return;
    const { mine, open, live } = chessLobbyData;
    const row = (title, subtitle, btn) => `<div class="friend-row"><div style="min-width:0;"><div class="fname">${esc(title)}</div><div class="chess-sub">${esc(subtitle)}</div></div><div class="factions">${btn}</div></div>`;
    let html = '';
    if (mine.length) {
      html += `<div class="card" style="margin-bottom:14px;"><h2>Your games</h2>` + mine.map(g => {
        const opp = sameName(g.white, name) ? g.black : g.white;
        const side = sameName(g.white, name) ? 'white' : 'black';
        const sub = `you play ${side} · ` + (g.status === 'waiting' ? 'waiting for someone' : g.yourMove ? 'your move' : 'their move');
        return row(opp ? 'vs ' + opp : 'Waiting for someone', sub, `<button class="btn-mini accept" data-open="${esc(g.id)}">Open</button>`);
      }).join('') + `</div>`;
    }
    html += `<div class="card"><h2>Open tables</h2>` + (open.length
      ? open.map(g => row(g.white || g.black, `plays ${g.white ? 'white' : 'black'} · ${chessAgo(g.updated)}`, `<button class="btn-mini accept" data-join="${esc(g.id)}">Sit down</button>`)).join('')
      : `<p class="sub" style="margin:0;">Nobody is waiting right now. Start a game and tell a friend to open Chess Thing.</p>`) + `</div>`;
    if (live.length) {
      html += `<div class="card" style="margin-top:14px;"><h2>Being played</h2>` + live.map(g =>
        row(`${g.white} vs ${g.black}`, `${g.moves} moves`, `<button class="btn-mini neutral" data-open="${esc(g.id)}">Watch</button>`)).join('') + `</div>`;
    }
    holder.innerHTML = html;
  }

  // ---- Game ----
  function renderChessGame(id, level) {
    if (!chessOpenTable()) return;
    if (chessScreen === 'lobby') socket.emit('chess-lobby-leave');
    if (chessScreen === 'game' && !botMode && level) socket.emit('chess-close');
    botStop();
    chessScreen = 'game'; chessId = id; chessGame = null; chessGone = false; chessChat = [];
    if (level) {
      const side = Math.random() < 0.5 ? 1 : -1, label = level.charAt(0).toUpperCase() + level.slice(1) + ' bot';
      botMode = { level, side, label };
      chessGame = { id: 'bot', white: side === 1 ? name : label, black: side === 1 ? label : name, status: 'playing', moves: [], result: null, reason: null, drawOffer: null };
    }
    chessSel = -1; chessTargets = []; chessPromo = null; chessConfirmResign = false; chessLastLen = -1; chessAwaiting = false; chessCacheKey = '';
    root.innerHTML = `
      <div class="app">
        <div class="topbar">
          <div class="avatar">${avatarInnerHTML()}</div>
          <div class="titles">
            <span class="room-name">Chess Thing</span>
            <span class="room-sub">chess and a chat</span>
          </div>
          <button class="switch" id="chess-back-btn" type="button">&lsaquo; lobby</button>
        </div>
        <div class="dash-content">
          <div class="chess-layout">
            <div class="chess-main">
              <div class="chess-status" id="chess-status" aria-live="polite"></div>
              <div id="chess-bar-top"></div>
              <div class="chess-board" id="chess-board" role="grid" aria-label="Chess board"></div>
              <div id="chess-bar-bot"></div>
              <div class="chess-acts" id="chess-acts"></div>
              <div class="chess-moves" id="chess-moves" aria-label="Moves"></div>
            </div>
            ${level ? '' : `<div class="card chess-chat">
              <h2>Chat</h2>
              <div class="chess-msgs" id="chess-msgs" aria-live="polite"></div>
              <form class="chess-cform" id="chess-cform">
                <input type="text" id="chess-ctext" maxlength="300" placeholder="Say something" autocomplete="off" />
                <button class="btn-sage" type="submit">Send</button>
              </form>
            </div>`}
          </div>
        </div>
      </div>`;
    document.getElementById('chess-back-btn').onclick = () => go('lobby');
    document.getElementById('chess-board').onclick = e => {
      const sq = e.target.closest('.chess-sq');
      if (sq) chessOnSquare(+sq.getAttribute('data-sq'));
    };
    document.getElementById('chess-acts').onclick = chessOnAction;
    const cform = document.getElementById('chess-cform');
    if (cform) cform.onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById('chess-ctext');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chess-chat', { id: chessId, text });
      input.value = '';
      input.focus();
    };
    if (level) { chessRenderGame(); botMaybeMove(); return; }
    chessRenderChat();
    chessRenderGame();
    socket.emit('chess-open', { id });
  }

  function chessReplay() {
    const mv = (chessGame && chessGame.moves) || [];
    const key = chessId + ':' + mv.length;
    if (chessCacheKey !== key) { chessCacheKey = key; chessCacheRp = window.Engine.replay(mv); }
    return chessCacheRp;
  }

  function chessRenderGame() {
    if (chessScreen !== 'game') return;
    const statusEl = document.getElementById('chess-status');
    const boardEl = document.getElementById('chess-board');
    if (!statusEl || !boardEl) return;
    const acts = document.getElementById('chess-acts');
    const E = window.Engine;
    if (!chessGame) {
      statusEl.textContent = chessGone ? 'This table has been cleared.' : 'Finding your table…';
      boardEl.innerHTML = '';
      ['chess-bar-top', 'chess-bar-bot', 'chess-moves'].forEach(i => { document.getElementById(i).innerHTML = ''; });
      acts.innerHTML = chessGone ? `<button class="btn-mini accept" data-act="lobby">Back to lobby</button>` : '';
      return;
    }
    const gm = chessGame, rp = chessReplay(), g = rp.g;
    const mc = botMode ? botMode.side : sameName(gm.white, name) ? 1 : sameName(gm.black, name) ? -1 : 0;
    const over = gm.status === 'over', waiting = gm.status === 'waiting';
    if (g.hist.length !== chessLastLen) { chessSel = -1; chessTargets = []; chessPromo = null; chessConfirmResign = false; chessLastLen = g.hist.length; chessAwaiting = false; }
    const turn = g.turn, myTurn = !over && !waiting && mc !== 0 && turn === mc && !chessAwaiting;
    const bottom = mc === -1 ? -1 : 1, top = -bottom;
    const seat = c => (c === 1 ? gm.white : gm.black);

    let st;
    if (over) st = gm.result === 'draw' ? 'Draw' : (gm.result === 'white' ? 'White' : 'Black') + ' won';
    else if (waiting) st = 'Waiting for someone to sit down…';
    else if (mc && turn === mc) st = 'Your move';
    else if (mc) st = (seat(turn) || 'Your opponent') + ' is thinking…';
    else st = (turn === 1 ? 'White' : 'Black') + ' to move';
    if (!over && !waiting && g.inCheck()) st += ' · check';
    statusEl.textContent = st;

    const bar = c => {
      const s = seat(c), on = !over && !waiting && turn === c;
      return `<div class="chess-bar${on ? ' on' : ''}"><span class="av">${s ? esc(s.charAt(0).toUpperCase()) : '?'}</span><div class="tx"><div class="nm">${s ? esc(s) + (!(botMode && s === botMode.label) && sameName(s, name) ? ' (you)' : '') : 'Empty seat'}</div><div class="sd">${c === 1 ? 'white' : 'black'}</div></div><span class="dot"></span></div>`;
    };
    document.getElementById('chess-bar-top').innerHTML = bar(top);
    document.getElementById('chess-bar-bot').innerHTML = bar(bottom);

    const b = g.b, flip = bottom === -1, tmap = {};
    const chkSq = !over && !waiting && g.inCheck() ? g.ks[turn === 1 ? 0 : 1] : -1;
    chessTargets.forEach(m => { tmap[m.t] = 1; });
    let html = '';
    for (let ri = 0; ri < 8; ri++) {
      const row = flip ? 7 - ri : ri;
      for (let ci = 0; ci < 8; ci++) {
        const col = flip ? 7 - ci : ci, sq = row * 16 + col, p = b[sq];
        let cls = 'chess-sq';
        if ((row + col) % 2) cls += ' d';
        if (rp.last && (rp.last.f === sq || rp.last.t === sq)) cls += ' last';
        if (chessSel === sq) cls += ' sel';
        if (sq === chkSq) cls += ' chk';
        if (tmap[sq]) cls += (p || (Math.abs(b[chessSel]) === 1 && (chessSel & 7) !== (sq & 7))) ? ' cap' : ' dot';
        if (myTurn) cls += ' act';
        html += `<button class="${cls}" data-sq="${sq}" role="gridcell" aria-label="${E.alg(sq)}${p ? ' ' + (p > 0 ? 'white' : 'black') + ' ' + CHESS_PIECE_NAME[Math.abs(p)] : ' empty'}">` +
          (ci === 0 ? `<i class="chess-co r">${8 - row}</i>` : '') + (ri === 7 ? `<i class="chess-co f">${'abcdefgh'.charAt(col)}</i>` : '') + (p ? chessPieceSVG(p) : '') + `</button>`;
      }
    }
    boardEl.innerHTML = html;

    let a = '';
    if (over) {
      const why = CHESS_REASON[gm.reason] || gm.reason;
      a = `<div class="chess-result"><span>${gm.result === 'draw' ? 'Draw by ' + esc(why) : (gm.result === 'white' ? 'White' : 'Black') + ' wins by ' + esc(why)}</span><span>${botMode ? `<button class="btn-mini accept" data-act="bot-again">Play again</button> ` : ''}<button class="btn-mini ${botMode ? 'neutral' : 'accept'}" data-act="lobby">Back to lobby</button></span></div>`;
    } else if (waiting) {
      a = mc ? `<button class="btn-mini neutral" data-act="cancel">Cancel table</button>` : `<button class="btn-mini accept" data-act="join">Sit down</button>`;
    } else if (mc) {
      if (chessPromo) {
        a = `<span class="hint">Promote to</span>` + chessPromo.map(m => `<button class="btn-mini neutral" data-act="promo" data-pr="${m.pr}">${CHESS_PROMO_NAME[m.pr]}</button>`).join('');
      } else {
        const myWord = mc === 1 ? 'white' : 'black', offer = gm.drawOffer;
        if (botMode) a += '';
        else if (offer && offer !== myWord) a += `<span class="hint">Draw offered</span><button class="btn-mini accept" data-act="draw-accept">Accept</button><button class="btn-mini neutral" data-act="draw-decline">Decline</button>`;
        else if (offer) a += `<span class="hint">Draw offered. Waiting for a reply.</span>`;
        else a += `<button class="btn-mini neutral" data-act="draw-offer">Offer a draw</button>`;
        a += chessConfirmResign ? `<button class="btn-mini decline" data-act="resign-yes">Really resign?</button>` : `<button class="btn-mini neutral" data-act="resign">Resign</button>`;
      }
    }
    acts.innerHTML = a;

    const mv = document.getElementById('chess-moves');
    mv.innerHTML = rp.sans.length ? rp.sans.map((s, i) => (i % 2 === 0 ? `<span class="n">${i / 2 + 1}.</span>` : '') + `<span class="m${i === rp.sans.length - 1 ? ' now' : ''}">${esc(s)}</span>`).join('') : '<span>White moves first.</span>';
    mv.scrollLeft = mv.scrollWidth;
  }

  function chessOnSquare(sq) {
    if (!chessGame || chessAwaiting) return;
    const rp = chessReplay(), g = rp.g;
    const mc = botMode ? botMode.side : sameName(chessGame.white, name) ? 1 : sameName(chessGame.black, name) ? -1 : 0;
    if (chessGame.status !== 'playing' || !mc || g.turn !== mc || chessPromo) return;
    if (chessSel >= 0 && chessTargets.some(m => m.t === sq)) {
      const ms = chessTargets.filter(m => m.t === sq);
      if (ms.length > 1) { chessPromo = ms; chessRenderGame(); } else chessSendMove(ms[0]);
      return;
    }
    const p = g.b[sq];
    if (p && (p > 0 ? 1 : -1) === mc) { chessSel = sq; chessTargets = g.legal().filter(m => m.f === sq); }
    else { chessSel = -1; chessTargets = []; }
    chessRenderGame();
  }
  function chessSendMove(m) {
    const E = window.Engine;
    const str = E.alg(m.f) + E.alg(m.t) + (m.pr ? 'pnbrqk'.charAt(m.pr - 1) : '');
    if (botMode) { chessSel = -1; chessTargets = []; chessPromo = null; botApply(str); return; }
    chessSel = -1; chessTargets = []; chessPromo = null; chessAwaiting = true;
    clearTimeout(chessAwaitTimer);
    chessAwaitTimer = setTimeout(() => { chessAwaiting = false; chessRenderGame(); }, 4000);
    socket.emit('chess-move', { id: chessId, move: str });
    chessRenderGame();
  }
  function chessOnAction(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    if (act === 'lobby') go('lobby');
    else if (act === 'join') socket.emit('chess-join', { id: chessId });
    else if (act === 'cancel') { socket.emit('chess-cancel', { id: chessId }); go('lobby'); }
    else if (act === 'promo') { const pr = +btn.getAttribute('data-pr'); const m = (chessPromo || []).find(x => x.pr === pr); if (m) chessSendMove(m); }
    else if (act === 'bot-again' && botMode) { const lv = botMode.level; renderChessGame('bot', lv); }
    else if (act === 'draw-offer') socket.emit('chess-draw-offer', { id: chessId });
    else if (act === 'draw-accept') socket.emit('chess-draw-accept', { id: chessId });
    else if (act === 'draw-decline') socket.emit('chess-draw-decline', { id: chessId });
    else if (act === 'resign') {
      chessConfirmResign = true; chessRenderGame();
      setTimeout(() => { if (chessConfirmResign) { chessConfirmResign = false; chessRenderGame(); } }, 4000);
    }
    else if (act === 'resign-yes') {
      chessConfirmResign = false;
      if (botMode) { chessGame.status = 'over'; chessGame.result = botMode.side === 1 ? 'black' : 'white'; chessGame.reason = 'resign'; chessRenderGame(); }
      else socket.emit('chess-resign', { id: chessId });
    }
  }

  function chessRenderChat() {
    const box = document.getElementById('chess-msgs');
    if (!box) return;
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60 || !box.children.length;
    box.innerHTML = chessChat.length ? chessChat.map(m => {
      const mine = sameName(m.name, name);
      return `<div class="msg ${mine ? 'mine' : 'theirs'}">${mine ? '' : `<span class="sender">${esc(m.name)}</span>`}<div class="bubble">${esc(m.text || '')}</div></div>`;
    }).join('') : '<div class="empty">No messages yet.<br/>Say hi whenever you are ready.</div>';
    if (stick) box.scrollTop = box.scrollHeight;
  }

  socket.on('chess-lobby', data => {
    chessLobbyData = data;
    if (chessScreen === 'lobby') chessRenderTables();
  });
  socket.on('chess-lobby-changed', () => { if (chessScreen === 'lobby') socket.emit('chess-list'); });
  socket.on('chess-list-refresh', () => socket.emit('chess-list'));
  socket.on('chess-go', ({ id }) => go('game-' + id));
  socket.on('chess-state', data => {
    if (chessScreen !== 'game') return;
    if (data.gone) {
      if (!data.id || data.id === chessId) { chessGame = null; chessGone = true; chessRenderGame(); }
      return;
    }
    if (!data.game || data.game.id !== chessId) return;
    chessGame = data.game;
    if (data.chat) { chessChat = data.chat; chessRenderChat(); }
    chessRenderGame();
  });
  socket.on('chess-chat', ({ id, message }) => {
    if (chessScreen !== 'game' || id !== chessId) return;
    chessChat.push(message);
    if (chessChat.length > 200) chessChat.shift();
    chessRenderChat();
    if (!sameName(message.name, name)) playBing();
  });
  socket.on('chess-error', msg => chessToast(msg));
  socket.on('chess-joined', ({ id, name: who }) => {
    playBing();
    chessToast(`${who} sat down at your table.`);
  });
  socket.on('chess-your-move', ({ id, from }) => {
    if (chessScreen === 'game' && chessId === id) return;
    playBing();
    chessToast(`${from} moved. It's your turn.`);
  });

  // ---- Signing in: the chat page leaves a token for this tab, so there is no second login ----
  function getToken() { try { return sessionStorage.getItem('ct_token'); } catch (e) { return null; } }
  function renderMessage(title, text, showLink) {
    chessScreen = null;
    root.innerHTML = `
      <div class="app">
        <div class="topbar">
          <div class="avatar">${esc(DEFAULT_AVATAR.value)}</div>
          <div class="titles"><span class="room-name">Chess Thing</span><span class="room-sub">chess and a chat</span></div>
        </div>
        <div class="dash-content"><div class="dash-wrap">
          <div class="card">
            <h2>${esc(title)}</h2>
            <p class="sub">${esc(text)}</p>
            ${showLink ? '<a class="btn-sage-outline" href="/" style="display:block;text-align:center;text-decoration:none;">Go to Chat Thing</a>' : ''}
          </div>
        </div></div>
      </div>`;
  }
  // ---- Bots (run in this browser, no server, no chat) ----
  const BOT_VAL = [0, 100, 320, 330, 500, 900, 0];
  function botEval(g) {
    let s = 0; const b = g.b;
    for (let sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq]; if (!p) continue;
      const t = Math.abs(p), r = sq >> 4, f = sq & 7;
      let v = BOT_VAL[t];
      const cen = 3 - Math.max(Math.abs(r - 3.5), Math.abs(f - 3.5)) + 0.5;
      if (t === 1) v += (p > 0 ? 6 - r : r - 1) * 6 + cen * 3;
      else if (t === 2 || t === 3) v += cen * 9;
      else if (t === 5) v += cen * 2;
      s += p > 0 ? v : -v;
    }
    return s * g.turn;
  }
  function botOrder(ms) {
    ms.forEach(m => { m.s = (m.c ? 10 * Math.abs(m.c) - Math.abs(m.p) + 100 : 0) + (m.pr ? 80 : 0); });
    return ms.sort((a, b) => b.s - a.s);
  }
  function botSearch(g, d, alpha, beta, ply, ctx) {
    if (++ctx.n % 512 === 0 && Date.now() > ctx.deadline) ctx.stop = true;
    if (ctx.stop) return 0;
    if (d <= 0) return ctx.q ? botQuiet(g, alpha, beta, 0, ctx) : botEval(g);
    const ms = botOrder(g.moves());
    let any = false;
    for (let i = 0; i < ms.length; i++) {
      if (!g.make(ms[i])) continue;
      any = true;
      const sc = -botSearch(g, d - 1, -beta, -alpha, ply + 1, ctx);
      g.undo();
      if (ctx.stop) return 0;
      if (sc >= beta) return beta;
      if (sc > alpha) alpha = sc;
    }
    if (!any) return g.inCheck() ? -99000 + ply : 0;
    return alpha;
  }
  function botQuiet(g, alpha, beta, qd, ctx) {
    const stand = botEval(g);
    if (qd >= 4) return stand;
    if (stand >= beta) return beta;
    if (stand > alpha) alpha = stand;
    const ms = botOrder(g.moves(true));
    for (let i = 0; i < ms.length; i++) {
      if (!g.make(ms[i])) continue;
      const sc = -botQuiet(g, -beta, -alpha, qd + 1, ctx);
      g.undo();
      if (sc >= beta) return beta;
      if (sc > alpha) alpha = sc;
    }
    return alpha;
  }
  // Returns a move string like "e2e4" or "e7e8q" for the side to move after `moves`.
  function chessBotPick(E, moves, level) {
    const g = E.replay(moves).g;
    const root = g.legal();
    if (!root.length) return null;
    const str = m => E.alg(m.f) + E.alg(m.t) + (m.pr ? 'pnbrqk'.charAt(m.pr - 1) : '');
    if (level === 'easy' && Math.random() < 0.4) return str(root[Math.floor(Math.random() * root.length)]);
    const cfg = level === 'hard' ? { depth: 4, ms: 1300, q: true, noise: 2 } : level === 'medium' ? { depth: 2, ms: 600, q: false, noise: 12 } : { depth: 1, ms: 300, q: false, noise: 25 };
    const ctx = { n: 0, stop: false, deadline: Date.now() + cfg.ms, q: cfg.q };
    let best = root[Math.floor(Math.random() * root.length)];
    botOrder(root);
    for (let d = 1; d <= cfg.depth; d++) {
      let bScore = -Infinity, bMove = null;
      for (let i = 0; i < root.length; i++) {
        g.make(root[i]);
        const sc = -botSearch(g, d - 1, -Infinity, Infinity, 1, ctx) + Math.random() * cfg.noise;
        g.undo();
        if (ctx.stop) break;
        if (sc > bScore) { bScore = sc; bMove = root[i]; }
      }
      if (ctx.stop) break;
      if (bMove) { best = bMove; root.sort((a, b) => (a === bMove ? -1 : b === bMove ? 1 : 0)); }
    }
    return str(best);
  }

  function botStop() { clearTimeout(botTimer); botTimer = null; botMode = null; }
  function botApply(str) {
    chessGame.moves = chessGame.moves.concat(str);
    const st = window.Engine.replay(chessGame.moves).g.status();
    if (st.over) { chessGame.status = 'over'; chessGame.result = st.winner === 1 ? 'white' : st.winner === -1 ? 'black' : 'draw'; chessGame.reason = st.kind; }
    chessRenderGame();
    if (!st.over) botMaybeMove();
  }
  function botMaybeMove() {
    if (!botMode || !chessGame || chessGame.status !== 'playing') return;
    if ((chessGame.moves.length % 2 === 0 ? 1 : -1) === botMode.side) return; // your turn
    const mine = botMode;
    clearTimeout(botTimer);
    const movesNow = chessGame.moves.slice(), started = Date.now();
    botTimer = setTimeout(async () => {
      if (botMode !== mine || !chessGame || chessGame.status !== 'playing') return;
      const mv = await chessBotAsk(mine.level, movesNow);
      // Don't play a move if you left, restarted, or the position changed while it was thinking.
      if (botMode !== mine || !chessGame || chessGame.status !== 'playing' || chessGame.moves.length !== movesNow.length) return;
      if (mv) botApply(mv);
    }, Math.max(0, 450 - (Date.now() - started)));
  }
  // Asks the Stockfish engine at chess-api.com for a move. If that fails, is slow, or sends back something
  // that isn't a legal move, the built-in bot above plays instead, so a game never gets stuck.
  const BOT_API = 'https://chess-api.com/v1';
  const BOT_DEPTH = { easy: 1, medium: 6, hard: 14 };
  async function chessBotAsk(level, moves) {
    const E = window.Engine;
    try {
      if (level === 'easy' && Math.random() < 0.3) return chessBotPick(E, moves, 'easy'); // easy sometimes just fumbles
      const fen = E.replay(moves).g.fen();
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
      let data;
      try {
        const res = await fetch(BOT_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fen, depth: BOT_DEPTH[level] || 6, variants: 1, maxThinkingTime: 100 }), signal: ctl.signal });
        if (!res.ok) throw new Error('bad status');
        data = await res.json();
      } finally { clearTimeout(t); }
      if (Array.isArray(data)) data = data[0];
      const mv = String((data && (data.move || data.lan)) || '').toLowerCase();
      if (/^[a-h][1-8][a-h][1-8][nbrq]?$/.test(mv) && E.replay(moves.concat(mv)).ok) return mv;
    } catch (e) { /* fall through to the built-in bot */ }
    return chessBotPick(E, moves, level);
  }
  function route() {
    if (!authed) return;
    const bm = /^#bot-(easy|medium|hard)$/.exec(location.hash);
    if (bm) { renderChessGame('bot', bm[1]); return; }
    const m = /^#game-([a-z0-9]+)$/.exec(location.hash);
    if (m) renderChessGame(m[1]); else renderChessLobby();
  }
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
  window.addEventListener('hashchange', route);

  renderMessage('Connecting…', 'One moment.', false);
  socket.on('connect', () => {
    const t = getToken();
    if (t) socket.emit('chess-auth', { token: t });
    else { authed = false; renderMessage('Log in first', 'Chess Thing uses your Chat Thing account. Log in on Chat Thing, then press the Chess Thing button on your dashboard.', true); }
  });
  socket.on('chess-auth-ok', d => { authed = true; name = d.name; avatar = d.avatar || DEFAULT_AVATAR; route(); });
  socket.on('chess-auth-failed', () => {
    authed = false;
    renderMessage('Log in again', 'Your sign-in has run out. Log in on Chat Thing, then press the Chess Thing button on your dashboard.', true);
  });
})();
</script>
</body>
</html>
