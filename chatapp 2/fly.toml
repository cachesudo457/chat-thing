# Rename "app" to whatever name you picked (must be globally unique on Fly).
# If you already ran `fly launch` and it generated its own fly.toml, merge
# the [mounts], [env], and [http_service] sections below into that file
# instead of overwriting it.
app = "the-room-chat"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

# Persistent storage for accounts.json, messages.json, etc. — without this,
# Fly wipes the container's disk on every deploy and every cold start.
# Create the volume once with: fly volumes create data --region iad --size 1
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
