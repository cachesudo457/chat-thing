<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The room — admin</title>
<style>
  :root {
    --cream: #faf6ef;
    --sage: #8ba888;
    --sage-dark: #6d8a6b;
    --peach: #ffe3cc;
    --peach-text: #7a4a1f;
    --lav: #e6e2f5;
    --lav-text: #4d4470;
    --ink: #4a453d;
    --ink-dim: #9b9488;
    --line: #e9e1d3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    background: var(--cream);
  }
  button, input, textarea { transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease; }
  button:active { transform: scale(0.96); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Shared shell, matches the main chat's .app / .topbar ---- */
  .app {
    color: var(--ink);
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--sage);
    color: #fff;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff3d;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; flex-shrink: 0; white-space: nowrap;
  }
  .topbar .titles { display: flex; flex-direction: column; line-height: 1.35; }
  .topbar .room-name { font-size: 16px; font-weight: 700; }
  .topbar .room-sub { font-size: 12px; color: #eef6ec; }
  .topbar .switch {
    margin-left: auto;
    font-size: 12.5px;
    color: #eef6ec;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 20px;
    background: #ffffff26;
    white-space: nowrap;
    border: none;
  }
  .topbar .switch:hover { background: #ffffff40; }

  /* ---- Gate screen, matches the main chat's sign-in gate exactly ---- */
  .gate {
    padding: 44px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    text-align: center;
    background: var(--cream);
    flex: 1;
  }
  .gate .avatar-lg {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--lav);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-bottom: 6px;
  }
  .gate h1 { font-size: 19px; color: var(--ink); margin: 0; font-weight: 700; }
  .gate p { color: var(--ink-dim); font-size: 13.5px; margin: 0; max-width: 290px; line-height: 1.7; }
  .gate-field { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px; text-align: left; }
  .gate-field label { font-size: 11.5px; color: var(--ink-dim); font-weight: 600; }
  .gate-field input {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 15px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    width: 100%;
  }
  .gate-field input:focus { border-color: var(--sage); }
  .gate button.join {
    background: var(--sage);
    color: #fff;
    border: none;
    padding: 13px 28px;
    border-radius: 24px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    width: 100%;
    max-width: 280px;
  }
  .gate button.join:hover { background: var(--sage-dark); }
  .gate .err { color: var(--peach-text); font-size: 12.5px; }

  /* ---- Dashboard ---- */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 40px;
  }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .section {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 16px;
    animation: msgIn 0.2s ease;
  }
  .section h2 { font-size: 14.5px; margin: 0 0 3px; color: var(--ink); }
  .section .sub { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 12px; line-height: 1.6; }
  textarea {
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    width: 100%;
    resize: vertical;
    min-height: 56px;
  }
  textarea:focus { border-color: var(--sage); }
  .composer-row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .btn-primary {
    background: var(--sage); color: #fff; border: none;
    border-radius: 20px; padding: 9px 20px; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-primary:hover { background: var(--sage-dark); }
  .btn-danger {
    background: var(--peach); color: var(--peach-text); border: none;
    border-radius: 20px; padding: 7px 14px; font-family: inherit;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-danger:hover { filter: brightness(0.95); }
  .btn-ghost {
    background: var(--lav); color: var(--lav-text); border: none;
    border-radius: 20px; padding: 7px 14px; font-family: inherit;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-ghost:hover { filter: brightness(0.95); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { color: var(--ink-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
  .badge.online { background: var(--sage); color: #fff; }
  .badge.offline { background: var(--line); color: var(--ink-dim); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { color: var(--ink-dim); font-size: 13.5px; padding: 24px 0; text-align: center; }
  .toast {
    position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  const root = document.getElementById('root');
  let adminPassword = '';

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  async function adminFetch(url, options) {
    const opts = options || {};
    opts.headers = Object.assign({ 'x-admin-password': adminPassword }, opts.headers || {});
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function renderGate(errorMsg) {
    root.innerHTML = `
      <div class="app">
        <div class="gate">
          <div class="avatar-lg">(ー_ー)</div>
          <h1>Admin</h1>
          <p>Enter the admin password to manage accounts.</p>
          <div class="gate-field">
            <label for="pw-in">Password</label>
            <input id="pw-in" type="password" placeholder="Admin password" />
          </div>
          ${errorMsg ? `<div class="err">${esc(errorMsg)}</div>` : ''}
          <button class="join" id="unlock-btn">Unlock</button>
        </div>
      </div>
    `;
    const pwIn = document.getElementById('pw-in');
    const go = async () => {
      const typed = pwIn.value;
      if (!typed) return;
      try {
        const res = await fetch('/admin/api/check', { method: 'POST', headers: { 'x-admin-password': typed } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Wrong password');
        adminPassword = typed;
        renderDashboard();
      } catch (e) {
        renderGate(e.message || 'Wrong password.');
      }
    };
    document.getElementById('unlock-btn').onclick = go;
    pwIn.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    pwIn.focus();
  }

  async function renderDashboard() {
    root.innerHTML = `
      <div class="app">
        <div class="topbar">
          <div class="avatar">(ー_ー)</div>
          <div class="titles">
            <span class="room-name">Admin</span>
            <span class="room-sub">manage the room</span>
          </div>
          <button class="switch" id="back-btn" type="button">Back to chat</button>
        </div>
        <div class="content">
          <div class="wrap">
            <div class="section">
              <h2>Send a message</h2>
              <p class="sub">Posts into the chat as "Admin", with a staff badge next to it.</p>
              <textarea id="admin-msg" maxlength="2000" placeholder="Type a message..."></textarea>
              <div class="composer-row"><button class="btn-primary" id="send-msg-btn">Send message</button></div>
            </div>

            <div class="section">
              <h2>Post an announcement</h2>
              <p class="sub">Shows as a highlighted banner in the chat, separate from normal messages.</p>
              <textarea id="admin-announcement" maxlength="500" placeholder="Type an announcement..."></textarea>
              <div class="composer-row"><button class="btn-primary" id="send-announcement-btn">Post announcement</button></div>
            </div>

            <div class="section">
              <h2>Chats</h2>
              <p class="sub">Read-only view of any conversation, including private rooms.</p>
              <div id="chats-holder"><div class="empty">Loading…</div></div>
            </div>

            <div class="section">
              <h2>Accounts</h2>
              <p class="sub">Permanently delete an account, or reset a password.</p>
              <div id="table-holder"><div class="empty">Loading…</div></div>
            </div>

            <div class="section">
              <h2>Suggestions</h2>
              <p class="sub">Feedback people have sent in from their dashboard.</p>
              <div id="suggestions-holder"><div class="empty">Loading…</div></div>
            </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-btn').onclick = () => { window.location.href = '/'; };
    document.getElementById('send-msg-btn').onclick = async () => {
      const el = document.getElementById('admin-msg');
      const text = el.value.trim();
      if (!text) return;
      try {
        await adminFetch('/admin/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        el.value = '';
        showToast('Message sent.');
      } catch (e) {
        showToast(e.message || 'Could not send message.');
      }
    };
    document.getElementById('send-announcement-btn').onclick = async () => {
      const el = document.getElementById('admin-announcement');
      const text = el.value.trim();
      if (!text) return;
      try {
        await adminFetch('/admin/api/announcement', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        el.value = '';
        showToast('Announcement posted.');
      } catch (e) {
        showToast(e.message || 'Could not post announcement.');
      }
    };
    await refreshUsers();
    await refreshSuggestions();
    await refreshChats();
  }

  async function refreshChats() {
    const holder = document.getElementById('chats-holder');
    if (!holder) return;
    try {
      const data = await adminFetch('/admin/api/rooms');
      const rows = [{ id: 'public', name: 'Public Chat', builtIn: true }].concat(
        (data.rooms || []).map(r => ({ id: r.id, name: r.name, public: r.public, ownerName: r.ownerName, memberCount: r.memberCount }))
      );
      holder.innerHTML = rows.map(r => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);">
          <span style="font-size:13.5px; color:var(--ink);">
            ${esc(r.name)}
            <span style="color:var(--ink-dim); font-weight:400; font-size:11.5px;">
              ${r.builtIn ? ' · everyone' : (r.public ? ' · public' : ' · private') + ' · ' + r.memberCount + ' member' + (r.memberCount === 1 ? '' : 's') + ' · owner: ' + esc(r.ownerName)}
            </span>
          </span>
          <button class="btn-ghost" data-chat-id="${esc(r.id)}" data-chat-name="${esc(r.name)}">View</button>
        </div>
      `).join('');
      holder.querySelectorAll('button[data-chat-id]').forEach(btn => {
        btn.onclick = () => renderChatViewer(btn.getAttribute('data-chat-id'), btn.getAttribute('data-chat-name'));
      });
    } catch (e) {
      holder.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  async function renderChatViewer(chatId, chatName) {
    root.innerHTML = `
      <div class="app">
        <div class="topbar">
          <div class="avatar">(ー_ー)</div>
          <div class="titles">
            <span class="room-name">${esc(chatName)}</span>
            <span class="room-sub">read-only view</span>
          </div>
          <button class="switch" id="back-to-admin-btn" type="button">Back to admin</button>
        </div>
        <div class="content">
          <div class="wrap">
            <div class="section" id="viewer-holder"><div class="empty">Loading…</div></div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-to-admin-btn').onclick = () => renderDashboard();
    const holder = document.getElementById('viewer-holder');
    try {
      const endpoint = chatId === 'public' ? '/admin/api/chat/public' : '/admin/api/chat/' + encodeURIComponent(chatId);
      const data = await adminFetch(endpoint);
      if (!data.messages || data.messages.length === 0) {
        holder.innerHTML = '<div class="empty">No messages in this chat yet.</div>';
        return;
      }
      holder.innerHTML = data.messages.map(m => `
        <div style="padding:10px 0; border-bottom:1px solid var(--line);">
          <div style="font-size:12.5px; font-weight:700; color:var(--sage-dark);">${esc(m.name)}${m.admin ? ' <span class="badge online" style="font-size:9px;">staff</span>' : ''}${m.announcement ? ' <span class="badge online" style="font-size:9px;">announcement</span>' : ''}</div>
          <div style="font-size:13.5px; color:var(--ink); line-height:1.6; margin-top:2px;">
            ${m.text ? esc(m.text) : ''}
            ${m.attachment ? `<span style="color:var(--ink-dim); font-style:italic;">[attachment: ${esc(m.attachment.filename)}]</span>` : ''}
          </div>
          <div style="font-size:11px; color:var(--ink-dim); margin-top:3px;">${new Date(m.ts).toLocaleString()}</div>
        </div>
      `).join('');
    } catch (e) {
      holder.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  async function refreshSuggestions() {
    const holder = document.getElementById('suggestions-holder');
    if (!holder) return;
    try {
      const data = await adminFetch('/admin/api/suggestions');
      if (!data.suggestions || data.suggestions.length === 0) {
        holder.innerHTML = '<div class="empty">No suggestions yet.</div>';
        return;
      }
      holder.innerHTML = data.suggestions.map(s => `
        <div style="padding:10px 0; border-bottom:1px solid var(--line);">
          <div style="font-size:13.5px; line-height:1.6; color:var(--ink);">${esc(s.text)}</div>
          <div style="font-size:11.5px; color:var(--ink-dim); margin-top:4px;">
            ${esc(s.name)} &middot; ${new Date(s.ts).toLocaleString()}
          </div>
        </div>
      `).join('');
    } catch (e) {
      holder.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  async function refreshUsers() {
    const holder = document.getElementById('table-holder');
    if (!holder) return;
    try {
      const data = await adminFetch('/admin/api/users');
      if (!data.users || data.users.length === 0) {
        holder.innerHTML = '<div class="empty">No accounts yet.</div>';
        return;
      }
      holder.innerHTML = `
        <table>
          <thead>
            <tr><th>Name</th><th>Status</th><th>Created</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.users.map(u => `
              <tr>
                <td>${esc(u.name)}</td>
                <td>
                  <span class="badge ${u.online ? 'online' : 'offline'}">${u.online ? 'Online' : 'Offline'}</span>
                </td>
                <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
                <td class="actions">
                  <button class="btn-ghost" data-action="reset" data-name="${esc(u.name)}">Reset password</button>
                  <button class="btn-danger" data-action="delete" data-name="${esc(u.name)}">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      holder.querySelectorAll('button[data-action]').forEach(btn => {
        btn.onclick = () => handleAction(btn.getAttribute('data-action'), btn.getAttribute('data-name'));
      });
    } catch (e) {
      holder.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }

  async function handleAction(action, name) {
    try {
      if (action === 'delete') {
        if (!confirm(`Permanently delete ${name}? This can't be undone — they're kicked immediately, their account and rooms they own are removed, and the name becomes claimable by anyone again. Their past messages stay in chat history.`)) return;
        await adminFetch('/admin/api/delete-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        showToast(`${name} deleted.`);
      } else if (action === 'reset') {
        const newPassword = prompt(`Enter a new password for ${name} (at least 4 characters):`);
        if (!newPassword) return;
        await adminFetch('/admin/api/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, password: newPassword }) });
        showToast(`${name}'s password updated.`);
      }
      refreshUsers();
    } catch (e) {
      showToast(e.message || 'Something went wrong.');
    }
  }

  renderGate();
})();
</script>
</body>
</html>
